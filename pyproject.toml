[project]
name = "pretix-reservation"
dynamic = ["version"]
description = "Payment-free storefront reservations for pretix"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pretix>=2026.6.0.dev0"]

[project.entry-points."pretix.plugin"]
pretix_reservation = "pretix_reservation:PretixPluginMeta"

[build-system]
requires = ["setuptools", "pretix-plugin-build"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_reservation.__version__"}

[tool.setuptools.packages.find]
include = ["pretix_reservation*"]
